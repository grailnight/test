name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - 'filter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Minigram-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # Кладём готовый APK в репозиторий, чтобы его можно было скачать одним файлом.
      - name: Publish APK to dist/
        if: github.ref_type == 'branch'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Minigram.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Minigram.apk
          git diff --cached --quiet || (git commit -m "Update built APK" && git push)
